<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Интерактивное демо OOOPS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;700;800&display=swap');
:root{font-family:'DM Sans',Arial,sans-serif;color:#271e29;background:#f6f2ee;--ink:#2a2029;--accent:#922d5e;--wash:#f8e9ee;--lime:#e1f472}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Manrope,Arial,sans-serif;letter-spacing:-.055em}button:focus-visible{outline:3px solid #652fb7;outline-offset:2px}.wrap{padding:22px clamp(14px,4vw,38px);min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.brand{font-weight:900;font-family:Manrope;font-size:clamp(22px,3vw,31px);letter-spacing:-.085em}.brand span{color:var(--accent)}.top-right{font-size:11px;border:1px solid #d7ccd0;border-radius:90px;padding:9px 12px;color:#625864}
.nav{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid #ddd5d5;padding-bottom:15px;margin-bottom:27px}
.nav button{background:transparent;border:1px solid transparent;border-radius:90px;padding:10px 15px;font-size:12px;font-weight:750;color:#555}
.nav button.active{background:var(--ink);color:#fff}.nav button:hover:not(.active){background:#fff}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}.head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin:0 0 22px}.head h1{font-size:clamp(29px,4.6vw,56px);line-height:1.06;margin:0}.head p{max-width:460px;font-size:13px;line-height:1.45;color:#655e65;margin:10px 0 0}.label{border:1px solid #dcd1d9;background:#fff;border-radius:90px;padding:7px 12px;font-size:11px;color:#655b63;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border-radius:17px;padding:clamp(16px,2.5vw,30px);border:1px solid #ede6e8;min-width:0}.card p{font-size:13px;line-height:1.55;color:#625964}.card h2{font-size:clamp(19px,3vw,28px);line-height:1.1;margin:10px 0 12px}.card h3{font-size:18px;margin:8px 0}.card strong{display:block;letter-spacing:-.045em}.card-color{background:var(--wash);border-color:transparent}.card-yellow{background:var(--lime);border-color:transparent}.card-violet{background:#e9d9ff;border-color:transparent}.ic{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#fff9;width:42px;height:42px;font-size:23px}.mini{color:#7a727b;font-size:11px;font-weight:700}.chip{display:inline-block;font-size:11px;background:#f1ebf1;border-radius:90px;padding:7px 10px;margin:4px 3px 0 0}.btn{border:0;background:var(--accent);color:white;padding:12px 17px;border-radius:11px;font-size:12px;font-weight:800;white-space:nowrap}.btn.alt{background:#f0e6ef;color:var(--ink)}.btn.dark{background:var(--ink)}.btn.yellow{background:var(--lime);color:#2c2532}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grow{flex:1}.stack{display:grid;gap:14px}.mt{margin-top:17px}.bar{height:8px;background:#eee7ef;border-radius:20px;overflow:hidden;margin:15px 0}.bar i{display:block;height:100%;background:var(--accent);border-radius:20px}.input{padding:12px 14px;border-radius:10px;border:1px solid #dcd4db;min-width:0;width:100%;background:#fff}.switches{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.switches button{padding:10px 14px;border-radius:9px;border:1px solid #ded6d9;background:#fff;font-size:12px;font-weight:750}.switches button.on{background:var(--ink);color:#fff}.itemline{padding:16px 0;border-bottom:1px solid #eee6ee;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}.itemline:last-child{border-bottom:0}.notice{background:#f7f4f0;border-radius:12px;padding:14px;font-size:12px;line-height:1.45;color:#615c60}.flex{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.word{font:800 clamp(28px,5vw,52px)/1.1 Manrope;text-align:center;min-height:180px;display:grid;place-items:center;background:#e5d5fc;border-radius:15px;margin:15px 0;padding:20px;cursor:pointer}.choice{border:1px solid #ded6e0;background:#fff;padding:14px;border-radius:12px;text-align:left;font-size:14px;font-weight:700;width:100%}.choice:hover{background:#f3ebff}.feedback{margin-top:16px;border-radius:12px;background:#eeefff;padding:14px;font-size:13px;line-height:1.5}.sample{font-size:10px;color:#7d7580;margin-top:12px}.preview-stage{min-height:275px;border-radius:15px;background:#dfecc7;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid #a5b293;padding:25px}.preview-stage .cube{width:160px;height:160px;border:16px solid #907358;transform:skewY(-8deg) rotate(5deg);box-shadow:20px 15px 0 #658166;position:relative;background:linear-gradient(45deg,#e1ecad,#c9d59b)}.preview-stage .cube:before,.preview-stage .cube:after{content:'';position:absolute;background:#86664e}.preview-stage .cube:before{height:14px;width:145px;transform:rotate(45deg);top:54px;left:-8px}.preview-stage .cube:after{height:14px;width:145px;transform:rotate(-45deg);top:54px;left:-8px}.preview-stage .cube span{position:absolute;top:80px;left:5px;font-size:11px;font-weight:900;z-index:1;color:#32482e}.demo-caption{font-size:10px;color:#7c727c;border-top:1px solid #dfd7df;margin-top:23px;padding-top:15px;line-height:1.5}footer{font-size:10px;letter-spacing:.09em;color:#7c7579;display:flex;justify-content:space-between;gap:8px;padding-top:24px}
@media(max-width:700px){.top-right{display:none}.wrap{padding:15px}.nav button{padding:9px 12px}.grid,.grid.two{grid-template-columns:1fr}.head{align-items:start}.head h1{font-size:32px}.card{padding:17px}.head .label{display:none}.preview-stage{min-height:210px}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
(function(){
const mode=new URLSearchParams(location.search).get('product')||'sofe';
const config={
 sofe:{brand:'SOFE',accent:'#8b2c58',ink:'#401f35',wash:'#fae7ef',lime:'#e6f36b',tabs:['Обзор','Питание','Активность','События','Профиль']},
 tutor:{brand:'TIME LAB',accent:'#743dd2',ink:'#453077',wash:'#eee8ff',lime:'#dcfc8d',tabs:['Ученик','Карточки','Тренажёр','Домашнее','Преподаватель']},
 dvor:{brand:'ДВОР.ДЕТИ',accent:'#406b49',ink:'#233c2b',wash:'#eff4e4',lime:'#f7dc79',tabs:['Главная','Проекты','Конструктор','О нас']}
};
const c=config[mode]||config.sofe;
const root=document.getElementById('app');
document.documentElement.style.setProperty('--accent',c.accent);document.documentElement.style.setProperty('--ink',c.ink);document.documentElement.style.setProperty('--wash',c.wash);document.documentElement.style.setProperty('--lime',c.lime);
let tab=0,meal='Завтрак',foods=['Овсянка','Чай'],activity='',word=0,flipped=false,answer=-1,homeDone=false,color='#907358',addons=[],trainerQuestion=0;
const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const head=(mini,title,desc)=>'<div class="head"><div><div class="eyebrow">'+mini+'</div><h1>'+title+'</h1>'+(desc?'<p>'+desc+'</p>':'')+'</div><span class="label">Интерактивное демо</span></div>';
const card=(label,title,desc,cl='')=>'<div class="card '+cl+'"><span class="mini">'+label+'</span><h2>'+title+'</h2><p>'+desc+'</p></div>';
const btn=(label,action,cl='')=>'<button type="button" class="btn '+cl+'" data-act="'+action+'">'+label+'</button>';
const switches=(items,selected,prefix)=>'<div class="switches">'+items.map(n=>'<button data-pick="'+prefix+':'+safe(n)+'" class="'+(n===selected?'on':'')+'">'+safe(n)+'</button>').join('')+'</div>';
const actions={
 sofe(){
 if(tab===0)return head('Личный обзор','Всё важное — рядом','Движение, питание и события в одном аккуратном пространстве.')+'<div class="grid">'+card('01 · ЕЖЕДНЕВНОЕ','Дневник питания','Добавляйте продукты и ведите записи без переключения между сервисами.','card-color')+card('02 · ДВИЖЕНИЕ','Мои активности','Отмечайте тренировки и сохраняйте историю занятий.','card-yellow')+card('03 · ВМЕСТЕ','События рядом','Идеи для спорта, прогулок и встреч с друзьями.','card-violet')+'</div><div class="grid two mt"><div class="card"><div class="row"><h3>Сегодня</h3><span class="chip">Мой ритм</span></div><p>Начните с простого действия — добавьте приём пищи или активность.</p>'+btn('Перейти к питанию','tab:1')+'</div><div class="card"><h3>В центре внимания</h3><p>Простые сценарии, персональное пространство, удобная навигация.</p>'+btn('Посмотреть события','tab:3','alt')+'</div></div>';
 if(tab===1)return head('Дневник','Питание','Добавьте запись в выбранный приём пищи.')+switches(['Завтрак','Обед','Ужин','Перекус'],meal,'meal')+'<div class="grid two"><div class="card"><span class="mini">'+safe(meal).toUpperCase()+'</span><h2>Ваши записи</h2>'+foods.map((f,i)=>'<div class="itemline"><span>◉ '+safe(f)+'</span><button class="btn alt" data-act="remove:'+i+'">Убрать</button></div>').join('')+'<div class="flex mt"><input class="input grow" id="foodInput" placeholder="Название продукта" maxlength="50">'+btn('Добавить','food-add')+'</div></div><div class="card card-color"><span class="ic">✦</span><h2>Простой дневник</h2><p>Удобно возвращаться к привычным действиям и вести записи в одном месте.</p><span class="chip">Продукты</span><span class="chip">Блюда</span><span class="chip">История</span></div></div>';
 if(tab===2)return head('Дневник активности','Больше движения','Выберите занятие и добавьте его в демонстрационный журнал.')+'<div class="grid">'+['Тренировка','Прогулка','Растяжка'].map((x,i)=>'<button class="card card-color" data-act="activity:'+x+'" style="text-align:left;border:0"><span class="ic">'+['✳','☀','✦'][i]+'</span><h2>'+x+'</h2><p>Добавить в журнал</p></button>').join('')+'</div>'+(activity?'<div class="notice mt">В демонстрационном журнале отмечено: <strong>'+safe(activity)+'</strong>. Запись существует только в этом превью.</div>':'');
 if(tab===3)return head('Сообщество','События и места','Активности, которые хочется разделить с другими.')+'<div class="grid">'+card('ВЫХОДНЫЕ','Прогулка по городу','Идея для встречи и активного отдыха.','card-yellow')+card('НА ЭТОЙ НЕДЕЛЕ','Движение вместе','Формат сообщества по интересам.','card-violet')+card('НОВЫЕ ЗНАКОМСТВА','Общие интересы','Выбирайте событие по настроению и компании.','card-color')+'</div>';
 return head('Профиль','Ваше пространство','Настройки, история действий и предпочтения в одном месте.')+'<div class="grid two">'+card('НАВИГАЦИЯ','Мои записи','История питания, активности и сохранённых событий.','card-color')+card('НАСТРОЙКИ','Под себя','Выбирайте привычные сценарии и возвращайтесь к нужным вкладкам.','card-yellow')+'</div>';
 },
 tutor(){
 if(tab===0)return head('Личный кабинет ученика','Учиться проще, когда всё вместе','Домашние задания, карточки, теория и тренажёр — без потерянных ссылок.')+'<div class="grid">'+card('ПОВТОРИТЬ','Слова недели','Карточки с переключением и самостоятельной проверкой.','card-violet')+card('ПОПРАКТИКОВАТЬСЯ','Времена','Небольшие интерактивные упражнения.','card-yellow')+card('ВЫПОЛНИТЬ','Домашнее задание','Задания и результаты в одном кабинете.','card-color')+'</div><div class="card mt"><div class="row"><div><span class="mini">СЛЕДУЮЩИЙ ШАГ</span><h3>Начни с тренажёра</h3></div>'+btn('Решить задание','tab:2')+'</div><p>Упражнения помогают лучше запоминать правила через практику.</p></div>';
 if(tab===1){const words=[['cousin','двоюродный брат / сестра'],['library','библиотека'],['strange','странный'],['bicycle','велосипед']];return head('Карточки','Слова в своём темпе','Нажимай на карточку, чтобы увидеть перевод. Затем переходи к следующей.')+'<div class="grid two"><div class="card card-violet"><span class="mini">КАРТОЧКА '+(word+1)+' / '+words.length+'</span><button class="word" type="button" data-act="flip">'+safe(flipped?words[word][1]:words[word][0])+'</button><div class="row">'+btn('← Назад','word-prev','alt')+btn('Следующая →','word-next')+'</div></div>'+card('КАК РАБОТАЕТ','Повторение без хаоса','Ученик проходит нужные слова, а преподаватель может отслеживать изученные темы и возвращаться к ошибкам.','card-color')+'</div>'}
 if(tab===2){const qs=[['She ___ reading now.',['is','does','are'],0],['Mia ___ dinner every evening.',['cook','cooks','cooking'],1],['They ___ football yesterday.',['play','played','plays'],1]];let q=qs[trainerQuestion];return head('Тренажёр','Проверим времена','Выбирай ответ — и сразу увидишь объяснение.')+'<div class="grid two"><div class="card"><span class="mini">ЗАДАНИЕ '+(trainerQuestion+1)+' / '+qs.length+'</span><h2 style="margin:23px 0">'+q[0]+'</h2><div class="stack">'+q[1].map((x,i)=>'<button class="choice" data-act="answer:'+i+'">'+safe(x)+'</button>').join('')+'</div>'+(answer<0?'':'<div class="feedback">'+(answer===q[2]?'Верно!':'Попробуй ещё раз.')+' Обрати внимание на время и форму глагола.</div>')+'<div class="mt">'+btn('Следующее задание →','quiz-next')+'</div></div>'+card('ДЛЯ ПРЕПОДАВАТЕЛЯ','Ошибки подсказывают тему','Упражнения можно строить вокруг слабых мест конкретного ученика.','card-yellow')+'</div>'}
 if(tab===3)return head('Домашняя работа','Все задания здесь','Результаты и материалы не теряются между чатами.')+'<div class="grid two"><div class="card"><span class="mini">ДЕМОНСТРАЦИЯ ДОМАШНЕГО ЗАДАНИЯ</span><h2>Describe your dream house</h2><p>Напиши 3–5 предложений о доме мечты, используй there is / there are.</p><label class="mini" for="homeText">МОЙ ОТВЕТ</label><textarea id="homeText" class="input" style="min-height:96px;resize:vertical" placeholder="There is a..." maxlength="800"></textarea><div class="mt">'+btn(homeDone?'Отправлено ✓':'Проверить отправку','home-submit')+'</div>'+(homeDone?'<div class="feedback">Демонстрационный ответ отмечен. Данные не сохраняются на сервере.</div>':'')+'</div>'+card('ПОСЛЕ УРОКА','Прозрачный прогресс','Ученик видит материалы и задания в одном месте, преподаватель — какие темы требуют повторения.','card-violet')+'</div>';
 return head('Кабинет преподавателя','Меньше рутины — больше внимания ученику','Пример интерфейса управления материалами и заданиями; никаких реальных ученических данных.')+'<div class="grid">'+card('МАТЕРИАЛЫ','Карточки и теория','Единая библиотека для разных уроков.','card-violet')+card('ЗАДАНИЯ','Конструктор','Выдача упражнений и редактирование ответов.','card-yellow')+card('АНАЛИТИКА','Ошибки и темы','Удобно видеть, что стоит повторить.','card-color')+'</div><div class="card mt"><h3>Пример плана занятия</h3><div class="itemline"><span>01. Разбор ошибок</span><span class="chip">Повторение</span></div><div class="itemline"><span>02. Упражнения на времена</span><span class="chip">Практика</span></div><div class="itemline"><span>03. Домашняя работа</span><span class="chip">Закрепление</span></div></div>';
 },
 dvor(){
 if(tab===0)return head('Модульная игровая система','Пространство, которое растёт','Первое знакомство с идеей модульных детских площадок и возможностями конфигурации.')+'<div class="grid two"><div class="preview-stage"><div class="cube"><span>ИГРА · ДВИЖЕНИЕ</span></div></div><div class="card"><span class="mini">О ПРОЕКТЕ</span><h2>Не просто площадка</h2><p>Модульная система позволяет собирать варианты под разные пространства и задачи.</p>'+btn('Посмотреть решения','tab:1')+'</div></div><div class="grid mt">'+card('ФОРМАТ','Комплекты','Базовые решения для знакомства с системой.','card-yellow')+card('ГИБКОСТЬ','Модули','Возможность выбирать конфигурацию.','card-color')+card('КОММУНИКАЦИЯ','Заявка','Понятный путь к обсуждению заказа.')+'</div>';
 if(tab===1)return head('Готовые проекты','Выберите направление','Варианты, которые помогают представить будущую игровую зону.')+'<div class="grid">'+card('01','Для двора','Компактная игровая площадка для частного пространства.','card-yellow')+card('02','Для сообщества','Решение для общего пространства.','card-color')+card('03','Индивидуально','Сборка проекта под отдельную задачу.','card-violet')+'</div><div class="mt">'+btn('Собрать конфигурацию','tab:2')+'</div>';
 if(tab===2)return head('Конструктор','Соберите свою идею','Выбирайте цвет и модули: интерфейс показывает демонстрационную конфигурацию.')+'<div class="grid two"><div class="preview-stage"><div class="cube" style="border-color:'+color+';box-shadow:20px 15px 0 #658166"><span>'+safe(addons.join(' · ')||'МОЙ ВАРИАНТ')+'</span></div></div><div class="card"><span class="mini">ЦВЕТ ДЕРЕВА</span><div class="switches">'+[['Орех','#907358'],['Светлый','#c6aa82'],['Тёмный','#5b4937']].map(a=>'<button style="border-color:'+a[1]+'" data-act="color:'+a[1]+'">'+a[0]+'</button>').join('')+'</div><h3>Элементы</h3><div class="switches">'+['Качели','Сетка','Лестница'].map(x=>'<button data-act="addon:'+x+'" class="'+(addons.includes(x)?'on':'')+'">'+x+'</button>').join('')+'</div><div class="notice">Это демонстрация вариантов интерфейса, не инженерный расчёт комплектации.</div></div></div>';
 return head('О проекте','Идея модульности','Сайт раскрывает концепцию, подход к выбору комплектации и преимущества единой системы.')+'<div class="grid">'+card('СМЫСЛ','Движение и игра','Проект объединяет игровую среду и модульный подход.','card-color')+card('ПОДАЧА','Понятные сценарии','От знакомства с продуктом до выбора комплектации.','card-yellow')+card('ВИЗУАЛ','Единый стиль','Информация об изделиях представлена цельно.')+'</div>';
 }
};
function render(){let html='<header class="top"><div class="brand">'+c.brand+'<span>✳</span></div><div class="top-right">OOOPS · Публичная демонстрация</div></header><nav class="nav" aria-label="Разделы демо">'+c.tabs.map((n,i)=>'<button type="button" data-act="tab:'+i+'" class="'+(i===tab?'active':'')+'">'+safe(n)+'</button>').join('')+'</nav><main>'+actions[mode in actions?mode:'sofe']()+'</main><footer><span>DESIGN & UX CASE / OOOPS</span><span>Данные в превью условные</span></footer>';root.innerHTML=html;}
root.addEventListener('click',e=>{let button=e.target.closest('[data-act],[data-pick]');if(!button)return;let pick=button.dataset.pick;if(pick){let [k,v]=pick.split(':');if(k==='meal')meal=v;render();return}let [act,value]=String(button.dataset.act||'').split(':');switch(act){case'tab':tab=Number(value);answer=-1;break;case'food-add':{let val=root.querySelector('#foodInput')?.value.trim();if(val)foods.push(val.slice(0,50));break}case'remove':foods.splice(Number(value),1);break;case'activity':activity=value;break;case'flip':flipped=!flipped;break;case'word-next':word=(word+1)%4;flipped=false;break;case'word-prev':word=(word+3)%4;flipped=false;break;case'answer':answer=Number(value);break;case'quiz-next':trainerQuestion=(trainerQuestion+1)%3;answer=-1;break;case'home-submit':homeDone=true;break;case'color':if(/^#[0-9a-f]{6}$/i.test(value))color=value;break;case'addon':addons=addons.includes(value)?addons.filter(x=>x!==value):addons.concat(value);break;}render()});
render();
})();
