name: OOOPS Jobs — ежедневные заказы

on:
  push:
    branches: [main]
    paths:
      - 'jobs-bot/**'
      - '.github/workflows/ooops-jobs.yml'
  schedule:
    - cron: '7 6 * * *' # primary: 09:07 Moscow time (UTC+3)
    - cron: '27 6 * * *' # fallback: 09:27; skips sending after a successful primary run
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = dry run; discover = show group IDs; send = publish digest'
        type: choice
        options:
          - send
          - discover
          - preview
        default: send

permissions:
  contents: read
  actions: read

concurrency:
  group: ooops-jobs-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decide whether scheduled fallback should send
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cutoff="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent_successes="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ooops-jobs.yml/runs?event=schedule&status=success&per_page=10" | jq --arg cutoff "$cutoff" --argjson current "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.created_at >= $cutoff and .id != $current)] | length')"
          if [ "$recent_successes" -gt 0 ]; then
            echo "A successful scheduled digest already ran in the last 30 minutes; fallback will not resend."
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          else
            echo "No recent successful scheduled digest; this run will send."
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test categorizer
        working-directory: jobs-bot
        run: npm test
      - name: Discover Telegram group ID (no messages sent)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        working-directory: jobs-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.OOOPS_JOBS_BOT_TOKEN }}
        run: node discover-chat.mjs
      - name: Preview matches without Telegram access
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[send-digest]') && !contains(github.event.head_commit.message, '[edit-digest:')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview')
        working-directory: jobs-bot
        env:
          DRY_RUN: '1'
        run: node digest.mjs
      - name: Read Telegram message IDs for in-place edit
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[edit-digest:')
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ids="$(printf '%s' "$COMMIT_MESSAGE" | sed -n 's/.*\[edit-digest:\([0-9,]*\)\].*/\1/p')"
          test -n "$ids"
          echo "TELEGRAM_EDIT_MESSAGE_IDS=$ids" >> "$GITHUB_ENV"
      - name: Send curated daily jobs to OOOPS group
        if: (github.event_name != 'schedule' || steps.delivery.outputs.should_send == 'true') && (github.event_name == 'schedule' || inputs.mode == 'send' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[send-digest]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[edit-digest:')))
        working-directory: jobs-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.OOOPS_JOBS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OOOPS_JOBS_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.OOOPS_JOBS_THREAD_ID }}
        run: node digest.mjs
