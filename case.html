<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3ef"><title>Проект — OOOPS!</title><style>:root{font-family:Manrope,Arial,sans-serif;color:#1c1b1b;background:#f5f3ef}*{box-sizing:border-box}body{margin:0}a{color:inherit}nav{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(14px);padding:17px clamp(18px,5vw,75px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd}nav .brand{font-size:26px;font-weight:900;letter-spacing:-.1em;text-decoration:none}nav .brand span{color:#8527ed}nav a:not(.brand){font-size:13px;font-weight:700}main{max-width:1380px;margin:auto;padding:55px clamp(18px,5vw,75px) 110px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.15em;font-weight:800}h1{font-size:clamp(53px,10vw,140px);font-weight:900;letter-spacing:-.09em;line-height:.91;margin:25px 0 30px;overflow-wrap:anywhere}.description{font-size:clamp(17px,2vw,24px);line-height:1.5;max-width:740px}.details{max-width:800px;white-space:pre-line;font-size:16px;line-height:1.8;margin:50px 0}.cover{background:#e5dbed;border-radius:10px;overflow:hidden;margin:50px 0}.cover img{display:block;width:100%;max-height:720px;object-fit:var(--fit,contain);object-position:var(--x,50%) var(--y,50%);transform:scale(var(--z,1));transform-origin:var(--x,50%) var(--y,50%)}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.gallery figure{margin:0;background:#ece8e2;padding:12px;border-radius:8px}.gallery img{width:100%;max-height:660px;object-fit:contain;display:block}.gallery figcaption{font-size:12px;margin:10px 0 4px;color:#666}.bottom{margin-top:80px;padding-top:30px;border-top:1px solid #ccc;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}button,.button{background:#1c1c1c;color:white;text-decoration:none;padding:14px 20px;border-radius:7px;border:0;font-weight:700;font-size:13px}#error{font-size:16px}@media(max-width:650px){main{padding-top:35px}.gallery{grid-template-columns:1fr}h1{margin-bottom:18px}.cover{margin:30px 0}}</style></head><body><nav><a class="brand" href="/">OOO<span>PS!</span></a><a href="/#work">Все проекты</a></nav><main><div id="content"><p>Загружаю проект…</p></div><div class="bottom"><span>OOOPS! digital studio</span><a class="button" href="/#contact">Обсудить проект</a></div></main><script>
if(navigator.doNotTrack!=='1'&&navigator.globalPrivacyControl!==true){fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'case_view',path:'/case.html',source:'internal'}),keepalive:true}).catch(()=>{})}
const q=new URLSearchParams(location.search),id=q.get('id');const root=document.getElementById('content');const media=u=>u?.startsWith('media/')?'/api/media?key='+encodeURIComponent(u):u;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{if(!id){root.textContent='Проект не указан';return}try{const r=await fetch('/api/public-projects');if(!r.ok)throw Error('Сервис недоступен');const data=await r.json(),p=data.projects.find(x=>x.id===id);if(!p){root.innerHTML='<h1>Проект не найден</h1><p>Возможно, он ещё готовится к публикации.</p>';return}document.title=p.title+' — OOOPS!';const img=(im,cls)=>'<img src="'+esc(media(im.url||im))+'" alt="'+esc(im.caption||p.title)+'" loading="lazy" '+(cls||'')+'>';root.innerHTML='<span class="eyebrow">'+esc(p.category)+'</span><h1>'+esc(p.title)+'</h1><p class="description">'+esc(p.description)+'</p>'+(p.cover?'<div class="cover" style="background:'+esc(p.color)+';--x:'+Number(p.posX)+'%;--y:'+Number(p.posY)+'%;--z:'+(Number(p.zoom)/100)+';--fit:'+(p.coverFit==='cover'?'cover':'contain')+'">'+img({url:p.cover},'')+'</div>':'')+'<p class="details">'+esc(p.details||p.description)+'</p><div class="gallery">'+p.images.filter(x=>x.url!==p.cover).map((im,i)=>'<figure>'+img(im)+'<figcaption>'+esc(im.caption||('Изображение '+(i+1)))+'</figcaption></figure>').join('')+'</div>'}catch(e){root.textContent='Не удалось загрузить проект. Попробуйте обновить страницу.'}})();
</script></body></html>
