<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3ef"><title>Все работы — OOOPS digital studio</title><meta name="description" content="Все проекты OOOPS: веб-приложения, сайты, UX/UI-дизайн и визуальные концепции."><meta name="robots" content="index,follow"><link rel="canonical" href="https://ooops.agency/work.html"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@500;700;800&display=swap');
:root{font-family:'DM Sans',sans-serif;background:#f5f3ef;color:#211e21}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}nav{display:flex;align-items:center;justify-content:space-between;padding:24px clamp(22px,5vw,86px);border-bottom:1px solid #d5d0c8}.logo{font:900 30px/.9 Manrope;letter-spacing:-.1em}.logo b{color:#8424ea}.back{font-size:13px;font-weight:700}main{max-width:1500px;margin:auto;padding:80px clamp(22px,5vw,86px)}.overline{font-size:11px;font-weight:800;letter-spacing:.16em}h1{font:800 clamp(60px,9vw,135px)/.95 Manrope;letter-spacing:-.09em;margin:17px 0 40px}.intro{font-size:clamp(17px,2vw,24px);line-height:1.5;max-width:780px;margin-bottom:55px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.item{background:#fff;overflow:hidden;border:1px solid #d9d3cb;border-radius:12px;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;min-width:0}.item:hover,.item:focus-visible{transform:translateY(-8px);box-shadow:0 24px 50px #0002}.visual{height:250px;overflow:hidden;background:var(--bg,#d8bafa);display:flex;align-items:center;justify-content:center;padding:18px;position:relative}.visual img{display:block;max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;border-radius:5px}.visual iframe{width:100%;height:100%;border:none;pointer-events:none;background:#fff}.mono{font:800 clamp(28px,4vw,48px)/.98 Manrope;letter-spacing:-.07em;padding:22px;word-break:break-word}.copy{padding:25px;flex:1;display:flex;flex-direction:column;gap:13px}.cat{font-size:11px;letter-spacing:.06em;color:#555}.copy h2{font:800 clamp(23px,2.5vw,33px)/1.08 Manrope;letter-spacing:-.05em;margin:0}.copy p{font-size:14px;line-height:1.5;color:#666;margin:0 0 13px}.action{font-size:13px;font-weight:800;margin-top:auto;text-decoration:underline;text-underline-offset:5px}footer{padding:35px clamp(22px,5vw,86px);border-top:1px solid #d9d3cb;font-size:13px}@media(max-width:970px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:1fr}.visual{height:245px}main{padding-top:55px}.intro{margin-bottom:30px}}</style></head><body>
<nav><a class="logo" href="/">OOO<b>PS!</b></a><a class="back" href="/#work">← Вернуться на главную</a></nav>
<main><span class="overline">OOOPS / SELECTED PROJECTS</span><h1>Все работы<span style="color:#8424ea">.</span></h1><p class="intro">Продукты, сайты, интерфейсы и визуальные решения. Здесь можно открыть историю каждого проекта и посмотреть его макеты.</p><section id="allWorks" class="grid" aria-live="polite"><p>Загружаем работы...</p></section></main>
<footer>OOOPS! / Digital product & creative studio</footer><script>
const root=document.getElementById('allWorks'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),media=s=>String(s||'').startsWith('media/')?'/api/media?key='+encodeURIComponent(s):s;
fetch('/api/public-projects',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{root.replaceChildren();const all=d.projects||[];const ordered=['sofe','tutor','dvor','calendar'];all.sort((a,b)=>{const ia=ordered.indexOf(a.id),ib=ordered.indexOf(b.id);return (ia<0?100:ia)-(ib<0?100:ib)});all.filter(p=>p.id!=='starostin').forEach(p=>{
const el=document.createElement('a');el.className='item';el.href='/portfolio/'+encodeURIComponent(p.id);el.style.setProperty('--bg',/^#[0-9a-f]{6}$/i.test(p.color||'')?p.color:'#d8bafa');const story=p.story||{},pdf=typeof story.sourcePdf==='string'&&story.sourcePdf.startsWith('/assets/portfolio/')&&story.sourcePdf.endsWith('.pdf')?story.sourcePdf:'';let visual=pdf?'<iframe tabindex="-1" loading="lazy" src="'+esc(pdf)+'#view=FitH&toolbar=0"></iframe>':p.cover?'<img loading="lazy" src="'+esc(media(p.cover))+'" alt="Материалы проекта '+esc(p.title)+'">':'<div class="mono">'+esc(p.title)+'</div>';el.innerHTML='<div class="visual">'+visual+'</div><div class="copy"><span class="cat">'+esc(p.category)+'</span><h2>'+esc(p.title)+'</h2><p>'+esc(story.headline||p.description)+'</p><span class="action">Смотреть проект ↗</span></div>';root.appendChild(el)
})}).catch(()=>{root.textContent='Не удалось загрузить проекты. Обновите страницу.'});
</script></body></html>
